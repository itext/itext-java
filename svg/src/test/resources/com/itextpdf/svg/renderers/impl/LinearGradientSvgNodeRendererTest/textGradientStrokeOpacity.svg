<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <defs>
    <linearGradient id="linearOpaque" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="50%" stop-color="#00aa00"/>
      <stop offset="100%" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="linearTransparent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#00aa00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0000ff" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="radialOpaque" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="55%" stop-color="#ff6600"/>
      <stop offset="100%" stop-color="#800080"/>
    </radialGradient>
    <radialGradient id="radialTransparent" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffff00" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff6600" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#800080" stop-opacity="0.1"/>
    </radialGradient>
  </defs>

  <rect width="760" height="300" fill="#303030"/>

  <g font-family="Courier" font-size="70" font-weight="bold"
     fill="none" stroke-width="5">
    <text x="30" y="110" stroke="url(#linearOpaque)">Linear</text>
    <text x="390" y="110" stroke="url(#linearTransparent)">Linear</text>
    <text x="30" y="235" stroke="url(#radialOpaque)">Radial</text>
    <text x="390" y="235" stroke="url(#radialTransparent)">Radial</text>
  </g>
</svg>
