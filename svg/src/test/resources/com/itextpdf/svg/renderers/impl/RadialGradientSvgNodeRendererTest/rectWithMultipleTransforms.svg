<svg x="0" y="0" width="600" height="600" xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
        <radialGradient id="myFillGradient"
                        cx="65%" cy="0%" r="10%"
                        gradientTransform="translate(0, 0.7) rotate(-90) scale(0.8)"
                        spreadMethod="reflect">
            <stop offset="0" stop-color="red"/>
            <stop offset="0.5" stop-color="green"/>
            <stop offset="1" stop-color="blue"/>
        </radialGradient>

        <radialGradient id="myStrokeGradient"
                        gradientUnits="userSpaceOnUse"
                        cx="50%" cy="0" r="20%"
                        gradientTransform="translate(0, -50) rotate(90)"
                        spreadMethod="repeat">
            <stop offset="0" stop-color="black"/>
            <stop offset="0.3" stop-color="orange"/>
            <stop offset="0.8" stop-color="lime"/>
            <stop offset="1" stop-color="magenta"/>
        </radialGradient>
    </defs>

    <rect transform="translate(-440, -100) rotate(-30) scale(2, 2)"
          x="100"
          y="300"
          width="250"
          height="100"
          fill="url(#myFillGradient)" stroke="url(#myStrokeGradient)" stroke-width="10"/>
</svg>
