<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
        "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 420 220" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#4d4d4d"/>
        </linearGradient>
        <mask id="textMaskLuma" mask-type="luminance" maskUnits="userSpaceOnUse" x="20" y="20" width="380" height="120">
            <rect x="20" y="20" width="380" height="120" fill="black"/>
            <text x="30" y="95" font-size="68" font-family="Helvetica" fill="url(#textGrad)">LUMA</text>
        </mask>
    </defs>

    <rect x="20" y="20" width="380" height="120" fill="#ef5350" mask="url(#textMaskLuma)"/>
    <text x="20" y="185" font-size="20" font-family="Helvetica" fill="#111111">Luminance text mask with gradient fill</text>
</svg>

