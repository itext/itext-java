<svg xmlns="http://www.w3.org/2000/svg" width="300" height="170" viewBox="0 0 300 170">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <mask id="m1" maskUnits="userSpaceOnUse" x="20" y="20" width="120" height="130">
      <rect x="20" y="20" width="120" height="130" fill="url(#g)"/>
    </mask>
    <mask id="m2" maskUnits="objectBoundingBox" x="0" y="0" width="1" height="1" maskContentUnits="objectBoundingBox">
      <circle cx="0.5" cy="0.5" r="0.45" fill="white"/>
    </mask>
  </defs>
  <rect width="300" height="170" fill="#eeeeee"/>
  <rect x="20" y="20" width="120" height="130" fill="#cc3300" mask="url(#m1)"/>
  <rect x="160" y="20" width="120" height="130" fill="#0033cc" mask="url(#m2)"/>
</svg>

