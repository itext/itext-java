<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
        "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 420 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <mask id="textMaskTspan" maskUnits="userSpaceOnUse" x="20" y="20" width="380" height="140">
            <rect x="20" y="20" width="380" height="140" fill="black"/>
            <text x="50" y="95" font-size="56" font-family="Helvetica" fill="white" transform="rotate(-8 210 95)">
                <tspan>TEXT</tspan>
                <tspan dx="14" fill="#bfbfbf">MASK</tspan>
            </text>
        </mask>
    </defs>

    <rect x="20" y="20" width="380" height="140" fill="#43a047" mask="url(#textMaskTspan)"/>
    <text x="20" y="210" font-size="20" font-family="Helvetica" fill="#111111">Text mask with tspan and transform</text>
</svg>

