<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220">
  <defs>
    <clipPath id="clipMain">
      <rect x="20" y="20" width="280" height="180" rx="20" ry="20"/>
    </clipPath>
    <linearGradient id="gradMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="black"/>
      <stop offset="100%" stop-color="white"/>
    </linearGradient>
    <mask id="inner">
      <circle cx="160" cy="110" r="70" fill="white" fill-opacity="0.7"/>
    </mask>
    <mask id="outer" x="0" y="0" width="1" height="1" maskUnits="objectBoundingBox" maskContentUnits="objectBoundingBox">
      <rect x="0" y="0" width="1" height="1" fill="url(#gradMain)"/>
      <rect x="0.1" y="0.1" width="0.8" height="0.8" fill="white" fill-opacity="0.4" mask="url(#inner)"/>
    </mask>
  </defs>
  <rect width="320" height="220" fill="#f2f2f2"/>
  <g clip-path="url(#clipMain)" mask="url(#outer)">
    <rect x="20" y="20" width="280" height="180" fill="#cc2200" fill-opacity="0.6"/>
    <circle cx="120" cy="100" r="60" fill="#0033cc" fill-opacity="0.5"/>
    <circle cx="200" cy="120" r="60" fill="#00aa44" fill-opacity="0.5"/>
  </g>
</svg>
