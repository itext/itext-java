<svg xmlns="http://www.w3.org/2000/svg" width="420" height="140" viewBox="0 0 420 140">
  <defs>
    <mask id="luminanceMask" style="mask-type:luminance" maskUnits="objectBoundingBox"
          maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
      <rect x="0" y="0" width="0.333333" height="1" fill="red" fill-opacity="0.75"/>
      <rect x="0.333333" y="0" width="0.333334" height="1" fill="green" fill-opacity="0.75"/>
      <rect x="0.666667" y="0" width="0.333333" height="1" fill="blue" fill-opacity="0.75"/>
    </mask>
    <mask id="alphaMask" style="mask-type:alpha" maskUnits="objectBoundingBox"
          maskContentUnits="objectBoundingBox" x="0" y="0" width="1" height="1">
      <rect x="0" y="0" width="0.333333" height="1" fill="red" fill-opacity="0.75"/>
      <rect x="0.333333" y="0" width="0.333334" height="1" fill="green" fill-opacity="0.75"/>
      <rect x="0.666667" y="0" width="0.333333" height="1" fill="blue" fill-opacity="0.75"/>
    </mask>
  </defs>
  <rect width="420" height="140" fill="white"/>
  <rect x="20" y="20" width="180" height="100" fill="#1769aa" mask="url(#luminanceMask)"/>
  <rect x="220" y="20" width="180" height="100" fill="#1769aa" mask="url(#alphaMask)"/>
</svg>


