<svg xmlns="http://www.w3.org/2000/svg" width="220" height="130" viewBox="0 0 220 130">
  <defs>
    <mask id="m">
      <rect x="20" y="20" width="180" height="90" fill="white"/>
    </mask>
  </defs>
  <rect x="20" y="20" width="180" height="90" fill="#0088cc">
    <animate attributeName="mask" values="none;url(#m);none" dur="2s" repeatCount="1"/>
  </rect>
</svg>
