<svg xmlns="http://www.w3.org/2000/svg" width="320" height="120" viewBox="0 0 320 120">
  <defs>
    <linearGradient id="markerGradient" gradientUnits="userSpaceOnUse"
                    x1="0" y1="5" x2="10" y2="5">
      <stop offset="0%" stop-color="cyan" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="blue" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="purple" stop-opacity="1"/>
    </linearGradient>

    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="9" refY="5" orient="auto"
            markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 Z"
            fill="url(#markerGradient)"/>
    </marker>
  </defs>

  <line x1="30" y1="60" x2="280" y2="60"
        stroke="blue" stroke-width="6"
        marker-end="url(#arrow)"/>
</svg>
