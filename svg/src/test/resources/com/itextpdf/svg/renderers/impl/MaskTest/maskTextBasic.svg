<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
        "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 400 220" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <mask id="textMaskBasic" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="20" y="20" width="360" height="120">
            <rect x="20" y="20" width="360" height="120" fill="black"/>
            <text x="40" y="96" font-size="72" font-family="Helvetica" fill="white">MASK</text>
        </mask>
    </defs>

    <rect x="20" y="20" width="360" height="120" fill="#1565c0" mask="url(#textMaskBasic)"/>
    <text x="20" y="185" font-size="20" font-family="Helvetica" fill="#111111">Text glyphs in mask reveal content</text>
</svg>

