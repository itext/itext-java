<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN"
        "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg viewBox="0 0 560 240" version="1.1"
     xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <linearGradient id="textTargetMaskGradient" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>
        <mask id="textTargetMaskGradientBased" mask-type="luminance" maskUnits="userSpaceOnUse" x="20" y="20" width="520" height="180">
            <rect x="20" y="20" width="520" height="180" fill="url(#textTargetMaskGradient)"/>
        </mask>
    </defs>

    <rect x="20" y="20" width="520" height="180" fill="#fff9e8"/>
    <text x="35" y="145" font-size="110" font-family="Helvetica" fill="#e53935"
          mask="url(#textTargetMaskGradientBased)">GRADIENT</text>
</svg>

