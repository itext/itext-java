<svg xmlns="http://www.w3.org/2000/svg" width="200" height="120" viewBox="0 0 200 120">
  <defs>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <mask id="m" filter="url(#blur)">
      <rect x="20" y="20" width="160" height="80" fill="white"/>
    </mask>
  </defs>
  <rect width="200" height="120" fill="#f2f2f2"/>
  <rect x="20" y="20" width="160" height="80" fill="#3333aa" mask="url(#m)"/>
</svg>

