<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200">
  <defs>
    <mask id="halfAlpha" maskUnits="userSpaceOnUse" x="0" y="0" width="240" height="200"
          style="mask-type:alpha">
      <rect width="240" height="200" fill="white" fill-opacity="0.5"/>
    </mask>
    <marker id="redDot" markerUnits="userSpaceOnUse" markerWidth="60" markerHeight="60"
            viewBox="0 0 60 60" refX="30" refY="30">
      <circle cx="30" cy="30" r="30" fill="red"/>
    </marker>
  </defs>
  <rect width="240" height="200" fill="white"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="blue" stroke-width="40"
        marker-end="url(#redDot)" mask="url(#halfAlpha)"/>
</svg>


