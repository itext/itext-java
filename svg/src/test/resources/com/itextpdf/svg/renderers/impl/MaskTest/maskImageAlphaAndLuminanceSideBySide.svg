      <image href="mask-alpha-luminance-side-by-side.png" x="0" y="0" width="1" height="1"
             preserveAspectRatio="none"/>
    </mask>
    <mask id="alphaMask" style="mask-type:alpha" maskUnits="objectBoundingBox"
