<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="paintGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#007aff" stop-opacity="1"/>
    </linearGradient>

    <clipPath id="paintClip">
      <circle cx="250" cy="200" r="145"/>
    </clipPath>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <rect
    x="60"
    y="50"
    width="380"
    height="300"
    fill="url(#paintGradient)"
    opacity="0.8"
    clip-path="url(#paintClip)"
  />
</svg>
