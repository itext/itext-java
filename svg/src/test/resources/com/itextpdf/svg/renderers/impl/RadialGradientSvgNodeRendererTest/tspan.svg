<svg x="0" y="0" width="600" height="600" xmlns="http://www.w3.org/2000/svg" version="1.1">
    <defs>
        <radialGradient id="myFillGradient" gradientUnits="userSpaceOnUse" cx="180" cy="360" r="340" fx="180" fy="140">
            <stop offset="0" stop-color="red"/>
            <stop offset="0.5" stop-color="green"/>
            <stop offset="1" stop-color="blue"/>
        </radialGradient>
        <radialGradient id="myStrokeGradient" gradientUnits="userSpaceOnUse" cx="320" cy="320" r="300" fx="320" fy="120">
            <stop offset="0" stop-color="black"/>
            <stop offset="0.5" stop-color="yellow"/>
            <stop offset="1" stop-color="magenta"/>
        </radialGradient>
    </defs>
    <text>
        <tspan x="50" y="300" font-family="Courier" font-size="128" stroke="url(#myStrokeGradient)"
               fill="url(#myFillGradient)" stroke-width="5">iText</tspan>
        <tspan x="50" y="500" font-family="Courier" font-size="128" stroke="url(#myStrokeGradient)"
               fill="url(#myFillGradient)" stroke-width="5">i<tspan font-weight="bold" stroke="url(#myFillGradient)" fill="url(#myStrokeGradient)" stroke-width="5">Tex</tspan>t</tspan>
    </text>

    <text font-family="Courier" font-size="64">
        <tspan x="20" y="150" fill="url(#myFillGradient)">iText<tspan dx="1em" dy="-50" font-weight="bold" fill="url(#myStrokeGradient)">iText</tspan><tspan dx="-190" dy="100">iText</tspan></tspan>
    </text>
</svg>
