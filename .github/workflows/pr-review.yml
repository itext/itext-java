name: Claude PR Review

on:
  issue_comment:
    types:
      - created
  pull_request_review_comment:
    types:
      - created

jobs:
  review:
    uses: pdf-tools/ai-code-reviewer/.github/workflows/claude-pr-review.yml@v1
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      anthropic_base_url: ${{ vars.CODE_REVIEW_API_URL }}
      additional_guidelines: .github/review-guidelines.md
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.CODE_REVIEW_API_KEY }}